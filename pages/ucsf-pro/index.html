<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UCSFViewer Pro</title>
<style>
  :root{
    --bg:#e7ebf0; --panel:#fff; --ink:#16202b; --muted:#66727f; --line:#d3dae2; --soft:#f6f8fa;
    --plot:#fff; --accent:#0f766e; --accent2:#0f766e1a; --grid:#eef1f5; --warn:#b4530f; --sel:#e11d48;
    --pk:#d6007a; --pksel:#00a35c; --cur:#f59e0b;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --ui:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font:12.5px/1.35 var(--ui);-webkit-font-smoothing:antialiased;
    display:flex;flex-direction:column;overflow:hidden}
  button,input,select{font:inherit}
  header{display:flex;align-items:center;gap:10px;padding:7px 12px;flex:none;flex-wrap:wrap;
    background:var(--panel);border-bottom:1px solid var(--line)}
  h1{font-size:14px;font-weight:650;margin:0;letter-spacing:-.01em;white-space:nowrap}
  h1 .n{color:var(--accent)}
  .by{font-size:11px;color:var(--muted)}
  .badge{font-size:10.5px;font-weight:650;padding:2px 7px;border-radius:999px;background:var(--accent2);color:var(--accent)}
  .tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .status{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--muted);max-width:40vw;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .status.warn{color:var(--warn)}
  .btn{font-size:11.5px;font-weight:550;color:#fff;background:var(--accent);border:1px solid var(--accent);
    border-radius:6px;padding:4px 10px;cursor:pointer;white-space:nowrap}
  .btn:hover{filter:brightness(1.08)}
  .btn.ghost{background:#fff;color:var(--ink);border-color:var(--line)}
  .btn.ghost:hover{border-color:var(--accent);color:var(--accent)}
  .btn.sm{padding:2px 7px;font-size:10.5px}
  .btn:disabled{opacity:.45;cursor:default;filter:none}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#fff}
  .seg span{padding:4px 9px;font-size:11px;font-weight:600;color:var(--muted);cursor:pointer;user-select:none}
  .seg span+span{border-left:1px solid var(--line)}
  .seg span.on{background:var(--accent);color:#fff}
  .seglbl{font-size:10px;color:var(--muted);font-weight:650;text-transform:uppercase;letter-spacing:.05em}
  .file{position:relative;overflow:hidden;display:inline-flex}
  .file input{position:absolute;inset:0;opacity:0;cursor:pointer}
  input[type=number],input[type=text],select{font-size:11.5px;padding:3px 5px;border:1px solid var(--line);
    border-radius:5px;background:#fff;color:var(--ink);min-width:0}
  input[type=number]{width:64px;font-family:var(--mono)}
  input[type=range]{accent-color:var(--accent)}
  textarea{font:11px/1.4 var(--mono);border:1px solid var(--line);border-radius:6px;padding:6px;width:100%}

  #work{flex:1;display:flex;min-height:0;gap:0;padding:8px 8px 0}
  #left{width:318px;flex:none;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding-right:2px}
  #left.hide{display:none}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:9px 10px}
  .card h2{font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);
    margin:0 0 7px;display:flex;align-items:center;gap:6px;cursor:pointer;user-select:none}
  .card h2 .cnt{margin-left:auto;font-family:var(--mono);text-transform:none;letter-spacing:0;font-weight:500}
  .card.collapsed>*:not(h2){display:none!important}
  .card.collapsed h2{margin:0}
  .row{display:flex;align-items:center;gap:6px;margin:5px 0;flex-wrap:wrap}
  .row>label{font-size:11px;color:var(--muted);font-weight:550;min-width:84px}
  .hint{font-size:10.5px;color:var(--muted);line-height:1.45}
  .mono{font-family:var(--mono)}
  .chk{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;cursor:pointer;user-select:none}
  .chk input{accent-color:var(--accent);margin:0}
  .tbl{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:10.5px}
  .tbl th{position:sticky;top:0;background:var(--soft);color:var(--muted);font-weight:700;text-align:right;
    padding:3px 4px;border-bottom:1px solid var(--line);font-size:9.5px}
  .tbl td{padding:2px 4px;text-align:right;border-bottom:1px solid var(--grid);white-space:nowrap}
  .tbl th:first-child,.tbl td:first-child{text-align:left}
  .tbl tr{cursor:pointer}
  .tbl tr:hover td{background:#0f766e0d}
  .tbl tr.on td{background:#f59e0b2a;font-weight:700}
  .scroll{max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:6px}
  .specrow{border:1px solid var(--line);border-left-width:4px;border-radius:7px;padding:5px 7px;margin-bottom:6px}
  .specrow .nm{font-weight:650;font-size:11.5px;display:flex;gap:6px;align-items:center}
  .specrow .nm .meta{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--muted);font-weight:500}
  .chips{display:grid;grid-template-columns:repeat(10,1fr);gap:3px}
  .chip{height:22px;border-radius:5px;border:1.5px solid;background:#fff;font:700 11px var(--mono);cursor:pointer;
    display:flex;align-items:center;justify-content:center;user-select:none}
  .chip.dim{opacity:.35}
  .bar{height:6px;border-radius:3px;background:var(--accent);display:inline-block;vertical-align:middle}

  #center{flex:1;display:flex;gap:0;min-width:0}
  .pane{background:var(--panel);border:1px solid var(--line);border-radius:9px;display:flex;flex-direction:column;
    min-width:0;min-height:0;overflow:hidden}
  .ptitle{display:flex;align-items:center;gap:7px;padding:4px 8px;border-bottom:1px solid var(--line);
    background:#fbfcfd;flex:none;flex-wrap:wrap;font-size:11px;font-weight:650}
  .ptitle .meta{margin-left:auto;font:500 10px var(--mono);color:var(--muted)}
  #mainpane{flex:1 1 52%}
  #traypane{flex:1 1 48%;min-width:200px}
  .cvwrap{position:relative;flex:1;min-height:0}
  .cvwrap canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
  .readout{position:absolute;top:6px;right:8px;font:10px var(--mono);background:#ffffffe0;border:1px solid var(--line);
    border-radius:5px;padding:2px 6px;pointer-events:none;white-space:pre}
  .empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);
    text-align:center;padding:20px}
  #slots{flex:1;display:flex;gap:6px;overflow-x:auto;overflow-y:hidden;padding:6px;min-height:0}
  .slot{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:7px;flex:none;min-height:0}
  .slot.cur{border-color:var(--cur);box-shadow:0 0 0 1.5px var(--cur)}
  .slot.preview{border-style:dashed;border-color:var(--accent)}
  .slothead{display:flex;align-items:center;gap:5px;padding:2px 6px;font:700 11px var(--mono);
    border-bottom:1px solid var(--line);background:var(--soft);cursor:pointer;white-space:nowrap}
  .slothead .tag{font:600 9.5px var(--ui);color:var(--muted)}
  .slothead .x{margin-left:auto;color:var(--muted);cursor:pointer;padding:0 2px}
  .slothead .x:hover{color:var(--warn)}
  .slotbody{flex:1;display:flex;min-height:0}
  .slot.note{width:220px;border-style:dashed;border-color:#94a3b8;background:repeating-linear-gradient(135deg,#f8fafc 0 8px,#eef2f6 8px 16px)}
  .notebody{padding:10px;display:flex;flex-direction:column;gap:6px;font-size:11px;line-height:1.45;color:var(--ink)}
  .notebody b{font-size:11.5px}
  .strip{position:relative;flex:none;min-height:0}
  .strip canvas{position:absolute;inset:0;width:100%;height:100%}
  .cfgchip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:6px;
    padding:1px 4px;background:#fff;font-weight:500}
  .cfgchip .dot{width:9px;height:9px;border-radius:3px}

  #seqbar{flex:none;height:236px;margin:0 8px 4px;background:var(--panel);border:1px solid var(--line);
    border-radius:9px;display:flex;flex-direction:column;overflow:hidden}
  #seqbar .ptitle{border-bottom:1px solid var(--line)}
  #seqscroll{flex:1;overflow:auto;position:relative;cursor:grab;min-height:0}
  #seqinner{position:relative}
  #seqcv{display:block;position:absolute;top:0;left:0}
  .split{flex:none;position:relative;z-index:5}
  .split.v{width:8px;cursor:col-resize}
  .split.h{height:8px;cursor:row-resize;margin:0 8px}
  .split::after{content:'';position:absolute;border-radius:2px;background:#b9c3cd}
  .split.v::after{left:3px;top:calc(50% - 22px);height:44px;width:2px}
  .split.h::after{top:3px;left:calc(50% - 22px);width:44px;height:2px}
  .split:hover::after,.split.drag::after{background:var(--accent)}
  .split.v:hover,.split.v.drag{background:linear-gradient(90deg,transparent 3px,#0f766e22 3px,#0f766e22 5px,transparent 5px)}
  #left.hide+.split{display:none}
  .noscroll{scrollbar-width:none}
  .noscroll::-webkit-scrollbar{display:none}
  .hbar{position:relative;height:16px;margin:3px 8px 6px;background:var(--soft);border:1px solid var(--line);border-radius:8px;flex:none;cursor:pointer}
  .hbar canvas.ov{position:absolute;left:0;top:0;width:100%;height:100%;border-radius:8px;pointer-events:none}
  .hbar .thumb{position:absolute;top:1px;bottom:1px;border-radius:7px;background:#0f766e2e;border:1.5px solid var(--accent);cursor:grab;min-width:26px;box-sizing:border-box}
  .hbar .thumb:active{cursor:grabbing;background:#0f766e45}
  .hbar.off .thumb{display:none}
  .hbar.off{opacity:.5}
  footer{text-align:center;font-size:10px;color:var(--muted);padding:0 0 3px;flex:none}

  .overlay{position:fixed;inset:0;background:#0b1a2a66;display:flex;align-items:center;justify-content:center;
    z-index:80;padding:20px}
  .wiz{background:#fff;border-radius:14px;width:min(860px,96vw);max-height:92vh;overflow:auto;padding:20px 22px;
    box-shadow:0 18px 50px #0b1a2a44}
  .wiz h3{margin:0 0 4px;font-size:16px}
  .wiz .sub{color:var(--muted);margin:0 0 14px}
  .opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:8px 0 16px}
  .opt{border:1.5px solid var(--line);border-radius:10px;padding:12px;cursor:pointer;min-width:0;overflow-wrap:anywhere}
  .opt:hover{border-color:var(--accent)}
  .opt.on{border-color:var(--accent);background:var(--accent2)}
  .opt.off{opacity:.5;cursor:not-allowed}
  .opt b{display:block;font-size:13px;margin-bottom:3px}
  .opt span{color:var(--muted);font-size:11.5px}
  .req{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
  .req span{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line)}
  .req span.ok{border-color:#2c944c;color:#2c944c;background:#2c944c12}
  .req span.no{border-color:var(--warn);color:var(--warn)}
  .ftbl{width:100%;border-collapse:collapse;font-size:11.5px}

  #proc{position:fixed;left:0;right:0;bottom:0;top:44px;z-index:40;background:var(--bg,#f3f5f8);display:none;flex-direction:column;gap:6px;padding:6px 8px}
  #proc .phead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:6px 10px}
  #proc .pconv{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:4px 10px;font-size:11px}
  #proc .pconv summary{cursor:pointer;font-weight:600;color:var(--muted)}
  #proc .pgrid{flex:1;min-height:0;display:grid;grid-template-columns:minmax(230px,18%) 1fr 1fr minmax(230px,18%);gap:6px}
  #proc .pshows{float:right;font-weight:400}
  #proc .pshow{color:var(--accent,#0f766e)}
  #proc .ppanel{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:6px 8px;overflow:auto;font-size:11px}
  #proc .ptit{font-weight:700;font-size:12px;margin-bottom:4px}
  #proc .psec{font:700 10px var(--ui);text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:8px 0 3px;border-top:1px solid var(--grid);padding-top:5px}
  #proc .prow{display:flex;align-items:center;gap:5px;margin:2px 0;flex-wrap:wrap}
  #proc .prow .lbl{min-width:30px;font-weight:600}
  #proc .prow input[type=number]{width:54px}
  #proc .pcv{background:var(--panel);border:1px solid var(--line);border-radius:9px;display:flex;flex-direction:column;min-width:0;min-height:0}
  #proc .pcvh{display:flex;align-items:center;gap:6px;padding:4px 8px;border-bottom:1px solid var(--line);flex-wrap:wrap;font-size:11px}
  #proc .pcvb{flex:1;min-height:0;position:relative}
  #proc .pcvb canvas{position:absolute;inset:0;width:100%;height:100%}
  #proc .pconsole{height:150px;flex:none;background:var(--panel);border:1px solid var(--line);border-radius:9px;display:flex;flex-direction:column;min-height:0}
  #proc .pconh{display:flex;align-items:center;gap:4px;padding:3px 8px;border-bottom:1px solid var(--line)}
  #proc .pconh>span:not(.hint){padding:2px 8px;border-radius:5px;cursor:pointer;font-size:11px;font-weight:600;color:var(--muted)}
  #proc .pconh>span.on{background:var(--accent);color:#fff}
  .pcon{margin:0;flex:1;overflow:auto;font:10.5px/1.45 var(--mono);padding:6px 10px;white-space:pre;background:#fbfcfd;border-radius:0 0 9px 9px}
  .hchip{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);display:inline-flex;gap:6px;align-items:center}
  .hchip.ok{border-color:#0f766e;color:#0f766e;background:#f0fdfa}
  .float.termwin{z-index:85}
  .termwin .fbody{padding:0;gap:0;background:#0f172a}
  .termbar{display:flex;gap:8px;align-items:center;padding:5px 8px;background:#fbfcfd;border-bottom:1px solid var(--line);flex:none}
  .termout{flex:1;min-height:0;overflow:auto;padding:8px 10px;font:12px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#e2e8f0;white-space:pre-wrap;word-break:break-all;cursor:text}
  .termout .tcmd{color:#7dd3fc}.termout .terr{color:#fca5a5}.termout .tdim{color:#94a3b8}.termout a{color:#5eead4}
  .termrow{display:flex;gap:6px;align-items:flex-start;padding:6px 10px 8px;border-top:1px solid #1e293b;flex:none}
  .termpr{font:12px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#5eead4;white-space:nowrap;padding-top:3px}
  #termin{flex:1;resize:none;border:none;outline:none;background:transparent;color:#f8fafc;font:12px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;padding:3px 0;min-height:20px}
  #termin:disabled{opacity:.5}
  header .termbtn{margin-left:6px}
  .wslist{max-height:150px;overflow:auto;border:1px solid var(--line);border-radius:6px;padding:4px 8px;display:flex;flex-direction:column;gap:2px}
  .ftbl td,.ftbl th{padding:4px 6px;border-bottom:1px solid var(--grid);text-align:left}
  .ftbl th{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}

  .float{position:fixed;z-index:60;background:#fff;border:1px solid var(--line);border-radius:11px;
    box-shadow:0 14px 40px #0b1a2a33;display:flex;flex-direction:column;resize:both;overflow:hidden;
    min-width:300px;min-height:180px}
  .fhead{display:flex;align-items:center;gap:8px;padding:7px 10px;border-bottom:1px solid var(--line);cursor:move;
    font-weight:650;font-size:12.5px;user-select:none;background:#fbfcfd;flex:none}
  .fhead .fx{margin-left:auto;border:none;background:none;font-size:18px;line-height:1;cursor:pointer;color:var(--muted)}
  .fbody{flex:1;min-height:0;overflow:auto;padding:9px 11px;display:flex;flex-direction:column;gap:6px}
  .pop{position:fixed;z-index:90;background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px;
    box-shadow:0 8px 24px #0b1a2a33;display:flex;flex-wrap:wrap;gap:4px;max-width:260px}
  .cand{border:1px solid var(--line);border-radius:7px;padding:5px;display:flex;gap:6px;align-items:stretch}
  .cand .info{font:10.5px var(--mono);min-width:150px;display:flex;flex-direction:column;gap:2px}
  .cand canvas{border:1px solid var(--grid);border-radius:4px}
  kbd{font:10px var(--mono);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px;background:#fff}
</style>
<style id="soft-light-theme">

:root{--bg:#edf1f2;--panel:#edf1f2;--soft:#e8edef;--muted:#52616b;--accent:#166c64}
.card{background:#edf1f2;border:1px solid #f7fafb;border-radius:14px;box-shadow:5px 5px 12px #ccd4d7,-5px -5px 12px #fff}
.btn.ghost{background:#edf1f2;border:1px solid #f8fafb;box-shadow:3px 3px 6px #cbd4d7,-3px -3px 6px #fff;color:#253f49}
.btn:active{box-shadow:inset 2px 2px 4px #b6c3c7,inset -2px -2px 4px #fff;transform:translateY(1px)}
.seg{padding:3px;gap:3px;background:#e4eaec;border:0;box-shadow:inset 2px 2px 5px #c6cfd3,inset -2px -2px 5px #fff;border-radius:9px}.seg span{border:0;border-radius:6px}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #167d72;outline-offset:3px}
</style>
</head>
<body>
<header>
  <h1>UCSF<span class="n">Viewer</span> Pro</h1>
  <span class="by">Composed by Qian Wang.</span>
  <span class="badge" id="modebadge">setup</span>
  <div class="tools" id="tools"></div>
  <button class="ghost sm termbtn" id="termbtn" title="Terminal in the working folder (NMRPipe via the helper service)" onclick="termOpen()">&gt;_ Terminal</button>
  <span class="status" id="status">Starting…</span>
</header>
<div id="work">
  <aside id="left"></aside>
  <div class="split v" id="sp-left" title="Drag to resize the side panel (double-click = default)"></div>
  <section id="center">
    <div class="pane" id="mainpane">
      <div class="ptitle" id="maintitle"></div>
      <div class="cvwrap"><canvas id="maincv"></canvas><div class="readout" id="mainro" style="opacity:0"></div>
        <div class="empty" id="mainempty">No 2D spectrum yet.</div></div>
    </div>
    <div class="split v" id="sp-main" title="Drag to resize main canvas vs side canvases (double-click = default)"></div>
    <div class="pane" id="traypane">
      <div class="ptitle" id="traytitle"></div>
      <div id="slots" class="noscroll"></div>
      <div class="hbar" id="slotbar" title="Drag to scroll through the strips"><div class="thumb"></div></div>
    </div>
  </section>
</div>
<div class="split h" id="sp-seq" title="Drag to resize the sequence window (double-click = default)"></div>
<div id="seqbar">
  <div class="ptitle" id="seqtitle">Sequence</div>
  <div id="seqscroll" class="noscroll"><div id="seqinner"><canvas id="seqcv"></canvas></div></div>
  <div class="hbar" id="seqhbar" title="Drag to scroll along the sequence; coloured ticks = assigned residues"><canvas class="ov"></canvas><div class="thumb"></div></div>
</div>

/* ============================ working folder (workspace) ============================ */
/* <working_directory>/{fid,ucsf,peaks,seq,save}. Chrome/Edge: File System Access API, read-write, missing sub-folders created.
   Safari/Firefox: folder input, read-only; outputs are downloaded and the status line names the sub-folder they belong in.
   Entries are kept as { path, get() -> File } so both routes share the same scanning code. */
const WS_SUBS = ['fid', 'ucsf', 'peaks', 'seq', 'save'];
const WS = { on: false, kind: null, root: null, rootName: '', sub: '', name: '', entries: [], dirs: new Set(), canWrite: false, created: [],
  readme: null, exps: [], ucsf: [], seq: [], sessions: [], lists: [], saves: [], pick: new Set(), seqPick: null, sessionPick: null, loaded: false, cands: null, seqFromWS: false };
const hasDirPicker = () => typeof window.showDirectoryPicker === 'function';
const FNMODE = { 0: 'undefined', 1: 'QF', 2: 'QSEQ', 3: 'TPPI', 4: 'States', 5: 'States-TPPI', 6: 'Echo-AntiEcho' };

// -- tiny IndexedDB store to remember the last folder handle (Chrome/Edge only) --
function idb() { return new Promise((res, rej) => { const r = indexedDB.open('ucsfpro', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }

// -- listing --
async function walkHandle(dir, prefix, out, dirs, depth) {
  for await (const [name, h] of dir.entries()) {
    if (name.startsWith('.') || out.length > 40000) continue;
    const p = prefix + name;
    if (h.kind === 'file') out.push({ path: p, h, get: () => h.getFile() });
    else { dirs.add(p); if (depth < 6) await walkHandle(h, p + '/', out, dirs, depth + 1); }
  }
}
function entriesFromFiles(files) {
  const out = [], dirs = new Set();
  for (const f of files) {
    const rp = (f.webkitRelativePath || f.name).split('/'); if (rp.some(s => s.startsWith('.'))) continue;
    const path = rp.slice(1).join('/') || f.name;   // drop the picked folder's own name
    out.push({ path, size: f.size, get: async () => f });
    const parts = path.split('/'); for (let i = 1; i < parts.length; i++) dirs.add(parts.slice(0, i).join('/'));
  }
  return { out, dirs, rootName: files.length ? (files[0].webkitRelativePath || '').split('/')[0] : '' };
}
const wsPathJoin = (a, b) => a ? a + '/' + b : b;
function wsIn(sub) { const pre = wsPathJoin(WS.sub, sub) + '/'; return WS.entries.filter(e => e.path.startsWith(pre)).map(e => Object.assign({}, e, { rel: e.path.slice(pre.length) })); }
// a folder looks like a working directory when one of its sub-folders holds real content

  let s = direct('ucsf', /\.ucsf$/i) * 3 + direct('seq') + direct('peaks') + direct('save');
  if (WS.entries.some(e => e.path.startsWith(pre + 'fid/') && /(^|\/)(readme[^/]*|acqus|procpar)$/i.test(e.path))) s += 3;
  return s;
}
function wsCandidates() {

  const scored = all.map(d => ({ d, s: wsScore(d) })).filter(x => x.s > 0);
  // skip folders that are themselves a sub-folder of a scored workspace (e.g. "ucsf")
  return scored.filter(x => !WS_SUBS.includes(x.d.split('/').pop()) || x.d === '');
}

// -- open --
async function wsOpenPicker() {
  try {
    const h = await window.showDirectoryPicker({ id: 'ucsfpro', mode: 'readwrite' });
    await wsUseHandle(h, null);
  } catch (e) { if (e && e.name !== 'AbortError') logErr('open folder', e.message); }
}
async function wsUseHandle(h, subHint) {

  Object.assign(WS, { on: true, kind: 'fsa', root: h, rootName: h.name, entries: out, dirs, canWrite: true, created: [], loaded: false });
  try { WS.canWrite = (await h.queryPermission({ mode: 'readwrite' })) === 'granted'; } catch (e) { /* keep true */ }

}
async function wsUseFiles(files) {

}
async function wsChoose(subHint) {

  const root = c.find(x => x.d === '');
  if (root) return wsSetSub('');
  if (c.length === 1) return wsSetSub(c[0].d);
  if (c.length > 1) { WS.cands = c; WIZ.step = 'wspick'; drawWizard(); return; }
  WS.cands = []; WIZ.step = 'wsinit'; drawWizard();   // nothing recognisable: offer to set this folder up
}
async function wsDirHandle(path, create) {

}

      const p = wsPathJoin(sub, s); if (WS.dirs.has(p)) continue;
      try { await wsDirHandle(p, true); WS.dirs.add(p); WS.created.push(s + '/'); } catch (e) { logErr('create ' + s + '/', e.message); }
    }
    idbPut('lastWS', { h: WS.root, sub }); idbPut('lastWSInfo', { root: WS.root.name, name: WS.name, sub }); WS.lastInfo = { root: WS.root.name, name: WS.name, sub };
  }

async function wsReopen(rec) {

    if (p !== 'granted') p = await rec.h.requestPermission({ mode: 'readwrite' });
    if (p !== 'granted') { setStatus('Access to ' + rec.h.name + ' was not granted.', true); return; }
    await wsUseHandle(rec.h, rec.sub);

// -- scan the chosen working folder --
function parseJcamp(t) { const o = {}; String(t).replace(/^##\$?([A-Za-z0-9_]+)=\s*(.*)$/gm, (m, k, v) => { o[k] = v.trim().replace(/^<(.*)>$/, '$1'); }); return o; }
function expTypeFromText(s) {
  const u = String(s || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (!u) return null;
  if (/CBCACONH|HNCOCACB|CBCACOHN/.test(u)) return 'CBCACONH';
  if (/HNCACB|CBCANH/.test(u)) return 'HNCACB';
  if (/HNCACO/.test(u)) return 'HNCACO';
  if (/HNCOCA/.test(u)) return 'HNCOCA';
  if (/HNCO/.test(u)) return 'HNCO';
  if (/HNCA/.test(u)) return 'HNCA';
  if (/CCCONH|CCONH/.test(u)) return 'CCCONH';
  if (/HCCHTOCSY/.test(u)) return 'HCCH_TOCSY';
  if (/HCCHCOSY/.test(u)) return 'HCCH_COSY';
  if (/HSQC|HMQC|TROSY/.test(u)) return /13C|C13|CH(?!N)|HCQ/.test(u) && !/15N|N15/.test(u) ? 'HSQC_CH' : 'HSQC_NH';

}
async function wsText(e) { try { return await (await e.get()).text(); } catch (err) { return ''; } }

  if (rd) { const txt = stripRtf(await wsText(rd)), map = [];
    for (const ln of txt.split(/\r?\n/)) { const m = ln.match(/^\s*(\d+)\s*[\t :=,;-]+\s*(\S.*?)\s*$/); if (m) map.push({ no: m[1], text: m[2], type: expTypeFromText(m[2]) }); }

  for (const e of fid) { const parts = e.rel.split('/'); if (parts.length < 2) continue; const d = parts.slice(0, -1).join('/'), f = parts[parts.length - 1];
    if (parts.length > 3) continue; if (!expDirs.has(d)) expDirs.set(d, {}); expDirs.get(d)[f] = e; }

    const x = { dir: d, no: d.split('/')[0].replace(/\.fid$/i, ''), vendor: files.acqus ? 'Bruker' : 'Varian/Agilent', dims: [], raw: ['ser', 'fid'].filter(f => files[f]) };
    x.files = files; x.acq = {};
    if (files.acqus) {
      const a = parseJcamp(await wsText(files.acqus)); x.acq.acqus = a;
      x.pulprog = a.PULPROG; x.dsp = { GRPDLY: a.GRPDLY, DECIM: a.DECIM, DSPFVS: a.DSPFVS };
      x.dims.push({ file: 'acqus', nuc: a.NUC1, td: +a.TD, sw: +a.SW, sfo: +a.SFO1, mode: 'DQD' });
      for (const f of ['acqu2s', 'acqu3s']) if (files[f]) { const b = parseJcamp(await wsText(files[f])); x.acq[f] = b; x.dims.push({ file: f, nuc: b.NUC1, td: +b.TD, sw: +b.SW, sfo: +b.SFO1, mode: FNMODE[b.FnMODE] || b.FnMODE }); }
    } else {
      const t = await wsText(files.procpar), g = k => { const m = t.match(new RegExp('^' + k + ' [^\\n]*\\n\\d+ ([^\\n]*)', 'm')); return m ? m[1].replace(/"/g, '').trim() : ''; };

      for (const [k, n] of [['ni', 'dn'], ['ni2', 'dn2']]) if (+g(k) > 1) x.dims.push({ file: 'procpar', nuc: g(n), td: 2 * +g(k), mode: g(k === 'ni' ? 'phase' : 'phase2') });
    }

    x.type = x.readmeType || x.ptype;

    x.converted = Object.keys(files).some(f => /\.fid$|^fid\.com$/i.test(f) && f !== 'fid') || fid.some(e => e.rel.startsWith(d + '/') && /\.fid$/i.test(e.rel) && e.rel.split('/').length > 2);
    const tt = fid.find(e => e.rel === d + '/pdata/1/title'); x.title = tt ? (await wsText(tt)).trim().split(/\r?\n/)[0] : '';

  WS.seq = seq.filter(e => !e.rel.includes('/') && /\.(fasta|fa|seq|txt|rtf|pdb|str)$/i.test(e.rel));
  WS.sessions = save.filter(e => !e.rel.includes('/') && /\.json$/i.test(e.rel));

  for (const L of [WS.ucsf, WS.seq, WS.sessions, WS.lists]) L.sort((a, b) => a.rel.localeCompare(b.rel));

}

// -- write: into the folder when we can, otherwise a download that names the sub-folder --
async function wsWrite(sub, name, text, quiet) {
  if (WS.on && WS.kind === 'fsa' && WS.canWrite) {
    try {
      const d = await wsDirHandle(sub ? wsPathJoin(WS.sub, sub) : WS.sub, true), fh = await d.getFileHandle(name, { create: true });
      const w = await fh.createWritable(); await w.write(text); await w.close();
      const p = wsPathJoin(WS.sub, sub ? sub + '/' + name : name); if (!WS.entries.some(e => e.path === p)) WS.entries.push({ path: p, h: fh, get: () => fh.getFile() });
      if (!quiet) setStatus('Saved ' + (sub ? sub + '/' : '') + name + ' in ' + WS.name + '.');
      return true;
    } catch (e) { logErr('write ' + sub + '/' + name, e.message); return false; }
  }
  if (quiet) return false;
  downloadText(name, text);
  setStatus('Downloaded ' + name + ' — it belongs in ' + (sub ? sub + '/ of ' : '') + (WS.on ? WS.name : 'your working folder') + '.');
  return true;
}
const wsBase = () => (WS.on ? WS.name : 'ucsf-assign').replace(/[^\w.-]+/g, '_');

#!/usr/bin/env python3
"""UCSFViewer Pro helper service — lets the browser app run NMRPipe in your working folder.

Usage (in a terminal where NMRPipe is set up, i.e. nmrPipe / bruk2pipe / pipe2ucsf are on PATH):

    python3 ucsfpro_helper.py "/path/to/working_directory"  [--port 8765]

* Standard library only; binds to 127.0.0.1 only.
* Every request must carry the token written to <working_directory>/ucsfpro-helper.json
  (the app reads it from the folder you opened, so only a page with access to that folder can use the helper).
* Paths are relative to the working directory; nothing outside it can be read, written or run.
* Only *.com scripts inside the working directory are run, with csh, in the script's own folder.
* The app's terminal can run NMRPipe tools and a few file utilities (see ALLOWED); pipes | and
  redirection > >> < work, every path must stay inside the working directory, no other shell syntax.
* If nmrPipe is not on PATH, the NMRPipe environment is loaded from ~/.cshrc, ~/.tcshrc, a login zsh
  or nmrInit*.com in the usual install places (or --init FILE / $NMRPIPE_INIT).
On macOS you can double-click "Start UCSFPro helper.command" (same folder as this file) instead.
Stop it with Ctrl+C (the token file is removed).
"""
import glob, json, os, platform, secrets, shlex, shutil, signal, subprocess, sys, threading, time
from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
from urllib.parse import urlparse, parse_qs

VERSION = '1.1'
TOOLS = ['nmrPipe', 'bruk2pipe', 'var2pipe', 'delta2pipe', 'xyz2pipe', 'pipe2xyz', 'pipe2ucsf', 'csh']
# commands the app's terminal may run (anything else is refused)
NMRPIPE_CMDS = ['nmrPipe', 'bruk2pipe', 'var2pipe', 'delta2pipe', 'xyz2pipe', 'pipe2xyz', 'pipe2ucsf', 'ucsf2pipe',
                'showhdr', 'sethdr', 'addNMR', 'ucsfdata']
FILE_CMDS = ['ls', 'cat', 'head', 'tail', 'wc', 'grep', 'diff', 'du', 'file', 'mkdir', 'cp', 'mv', 'echo', 'which']
SCRIPT_SHELLS = ['csh', 'tcsh']
ALLOWED = NMRPIPE_CMDS + FILE_CMDS + SCRIPT_SHELLS
ENV_SOURCE = 'PATH of the shell that started the helper'
MAX_READ = 1 << 30
JOBS = {}
LOCK = threading.Lock()


def inside(root, rel):
    """Resolve rel against root and refuse anything that leaves root (also through symlinks)."""
    if rel is None:
        raise ValueError('missing path')
    rel = rel.replace('\\', '/').lstrip('/')
    full = os.path.realpath(os.path.join(root, rel))
    if os.path.commonpath([full, root]) != root:
        raise PermissionError('path is outside the working folder')
    return full


class Job:
    """Runs one pipeline (list of argv) or a csh script; stdout+stderr are collected line by line."""
    def __init__(self, stages=None, cwd=None, stdin_path=None, stdout_path=None, append=False, script=None):
        self.lines, self.done, self.code, self.procs = [], False, None, []
        if script:
            shell = os.environ.get('UCSFPRO_CSH') or shutil.which('csh') or shutil.which('tcsh')
            if not shell:

    def kill(self):

            if os.path.isabs(a):
                raise PermissionError('absolute paths are not allowed: ' + a)
            if a.startswith('-'):
                continue
            j = os.path.join(cwd, a)
            if '/' in a or a in ('.', '..') or os.path.lexists(j):
                full = os.path.realpath(j)
                if os.path.commonpath([full, root]) != root:
                    raise PermissionError('path leaves the working folder: ' + a)
        if cmd in ('cp', 'mv'):
            names = [a for a in args if not a.startswith('-')]
            if len(names) >= 2 and names[-1].endswith('.com') and any(not n.endswith('.com') for n in names[:-1]):
                raise PermissionError('the terminal cannot create *.com scripts (they run without the command limits); the app writes them')
        if cmd in SCRIPT_SHELLS:
            flags = [a for a in args if a.startswith('-')]; rest = [a for a in args if not a.startswith('-')]
            if any(f not in ('-f', '-x', '-v', '-n', '-e') for f in flags):
                raise PermissionError('csh options allowed: -f -x -v -n -e')
            if not rest or not rest[0].endswith('.com') or not os.path.isfile(os.path.join(cwd, rest[0])):
                raise PermissionError('csh/tcsh can only run an existing *.com script in the working folder')
            shell = os.environ.get('UCSFPRO_CSH') or shutil.which(cmd) or shutil.which('csh') or shutil.which('tcsh')
            if not shell:
                raise ValueError('csh not found')
            exe = [shell] + (['-f'] if '-f' not in flags else []) + flags + rest
        else:
            path = shutil.which(cmd)
            if not path:
                raise ValueError("'%s' not found on PATH%s" % (cmd, ' (NMRPipe environment not loaded?)' if cmd in NMRPIPE_CMDS else ''))
            exe = [path] + args
        checked.append(exe)
    return checked, stdin_path, stdout_path, append


def load_nmrpipe_env(init=None):
    """Make nmrPipe reachable: if it is not on PATH, import the environment of the user's NMRPipe setup."""
    global ENV_SOURCE
    if shutil.which('nmrPipe'):
        return ENV_SOURCE
    home = os.path.expanduser('~')
    csh = shutil.which('csh') or shutil.which('tcsh')
    tries = []
    for f in [init, os.environ.get('NMRPIPE_INIT')]:
        if f: tries.append(('csh', os.path.expanduser(f)))
    tries += [('csh', os.path.join(home, '.cshrc')), ('csh', os.path.join(home, '.tcshrc')), ('zsh', None), ('bash', None)]
    sysname = 'mac' if platform.system() == 'Darwin' else 'linux'
    for base in [os.path.join(home, d) for d in ('nmrpipe', 'NMRPipe', 'nmr', 'pipe', 'Applications/nmrpipe')] + ['/opt/nmrpipe', '/usr/local/nmrpipe', '/Applications/nmrpipe', '/opt/NMRPipe']:
        inits = sorted(glob.glob(os.path.join(base, 'com', 'nmrInit.*.com')))
        arm = platform.machine().lower() in ('arm64', 'aarch64')
        # Apple Silicon → *arm64* init first; Intel → the plain 64-bit one
        inits.sort(key=lambda p: (sysname not in os.path.basename(p), ('arm64' in os.path.basename(p)) != arm, 'mac11' not in p, p))
        tries += [('csh', p) for p in inits[:2]]
    for kind, path in tries:
        if kind == 'csh' and (not csh or not path or not os.path.isfile(path)):
            continue
        if kind == 'zsh' and not shutil.which('zsh'):
            continue
        try:
            if kind == 'csh':
                argv = [csh, '-f', '-c', 'source "$UCSFPRO_RC" >& /dev/null; env']
            else:
                argv = [shutil.which(kind) or kind, '-l', '-c', 'env']
            env = dict(os.environ, UCSFPRO_RC=path or '')
            out = subprocess.run(argv, stdin=subprocess.DEVNULL, capture_output=True, text=True, timeout=15, env=env, errors='replace').stdout
        except (OSError, subprocess.SubprocessError):
            continue
        new = {}
        for ln in out.splitlines():
            k, eq, v = ln.partition('=')
            if eq and k.replace('_', 'a').isalnum() and not k[0].isdigit():
                new[k] = v
        if 'PATH' in new and shutil.which('nmrPipe', path=new['PATH']):
            for k, v in new.items():
                if k not in ('PWD', 'OLDPWD', 'SHLVL', '_', 'UCSFPRO_RC', 'TERM_SESSION_ID'):
                    os.environ[k] = v
            ENV_SOURCE = path if path else 'login ' + kind
            return ENV_SOURCE
    ENV_SOURCE = 'not found'
    return ENV_SOURCE


def make_handler(root, token):
    class H(BaseHTTPRequestHandler):
        server_version = 'ucsfpro-helper/' + VERSION

        def log_message(self, fmt, *a):
            sys.stderr.write('[helper] ' + (fmt % a) + '\n')

        def cors(self):
            origin = self.headers.get('Origin')
            # file:// pages send "null"; a local test server sends http://127.0.0.1:<port> or http://localhost:<port>
            if origin and (origin == 'null' or origin.startswith('http://127.0.0.1') or origin.startswith('http://localhost')):
                self.send_header('Access-Control-Allow-Origin', origin)
                self.send_header('Vary', 'Origin')
            self.send_header('Access-Control-Allow-Headers', 'X-UCSFPro-Token, Content-Type')
            self.send_header('Access-Control-Allow-Methods', 'GET, POST, OPTIONS')
            self.send_header('Access-Control-Allow-Private-Network', 'true')

        def reply(self, code, body, ctype='application/json'):
            if isinstance(body, (dict, list)):
                body = json.dumps(body).encode()
            elif isinstance(body, str):
                body = body.encode(); ctype = 'text/plain; charset=utf-8'
            self.send_response(code); self.cors()
            self.send_header('Content-Type', ctype); self.send_header('Content-Length', str(len(body))); self.end_headers()
            self.wfile.write(body)

        def do_OPTIONS(self):
            self.send_response(204); self.cors(); self.send_header('Content-Length', '0'); self.end_headers()

        def authorised(self):
            if not secrets.compare_digest(self.headers.get('X-UCSFPro-Token', ''), token):
                self.reply(403, 'bad or missing token'); return False
            return True

        def do_GET(self):
            if not self.authorised():
                return
            u = urlparse(self.path); q = parse_qs(u.query)
            try:
                if u.path == '/ping':
                    return self.reply(200, {'version': VERSION, 'root': os.path.basename(root), 'rootPath': root, 'tools': {t: bool(shutil.which(t)) for t in TOOLS},
                                            'env': ENV_SOURCE, 'allowed': ALLOWED, 'exec': True})
                if u.path == '/list':
                    out = []
                    for d, dirs, files in os.walk(root):
                        dirs[:] = [x for x in dirs if not x.startswith('.')]
                        if d[len(root):].count(os.sep) > 6:
                            continue
                        for f in files:
                            p = os.path.join(d, f); out.append({'path': os.path.relpath(p, root).replace(os.sep, '/'), 'size': os.path.getsize(p)})
                            if len(out) > 40000:
                                break
                    return self.reply(200, out)
                if u.path == '/read':
                    p = inside(root, q.get('path', [None])[0])
                    if not os.path.isfile(p):
                        return self.reply(404, 'no such file')
                    if os.path.getsize(p) > MAX_READ:
                        return self.reply(413, 'file too large')
                    with open(p, 'rb') as fh:
                        return self.reply(200, fh.read(), 'application/octet-stream')
                if u.path == '/job':
                    j = JOBS.get(q.get('id', [''])[0])
                    if not j:
                        return self.reply(404, 'no such job')
                    a = int(q.get('from', ['0'])[0])
                    with LOCK:
                        lines = j.lines[a:a + 2000]
                    return self.reply(200, {'lines': lines, 'done': j.done and a + len(lines) >= len(j.lines), 'code': j.code})
                return self.reply(404, 'unknown endpoint')
            except PermissionError as e:
                return self.reply(403, str(e))
            except Exception as e:
                return self.reply(400, str(e))


        def exec_line(self, root, req):

            cwd = inside(root, req.get('cwd') or '')
            if not os.path.isdir(cwd):
                raise ValueError('no such folder: ' + (req.get('cwd') or '.'))
            line = (req.get('cmd') or '').strip()
            if line == 'cd' or line.startswith('cd '):
                arg = line[2:].strip()
                if arg in ('', '~', '/'):
                    return self.reply(200, {'cwd': ''})
                if os.path.isabs(arg) or arg.startswith('~'):
                    raise PermissionError('absolute paths are not allowed: ' + arg)
                a = shlex.split(arg)[0] if arg else '.'
                d = os.path.realpath(os.path.join(cwd, a))
                if os.path.commonpath([d, root]) != root:
                    raise PermissionError('path leaves the working folder: ' + a)
                if not os.path.isdir(d):
                    raise ValueError('cd: no such folder: ' + a)
                return self.reply(200, {'cwd': rel_of(root, d)})
            stages, sin, sout, app = parse_command(root, cwd, line)
            jid = secrets.token_hex(8); JOBS[jid] = Job(stages, cwd, sin, sout, app)
            return self.reply(200, {'id': jid, 'cwd': rel_of(root, cwd)})

        def do_POST(self):
            if not self.authorised():
                return
            u = urlparse(self.path); q = parse_qs(u.query)
            n = int(self.headers.get('Content-Length') or 0)
            body = self.rfile.read(n) if n else b''
            try:
                if u.path == '/write':
                    p = inside(root, q.get('path', [None])[0])
                    os.makedirs(os.path.dirname(p), exist_ok=True)
                    with open(p, 'wb') as fh:
                        fh.write(body)
                    return self.reply(200, {'ok': True, 'bytes': len(body)})
                if u.path == '/run':
                    rel = json.loads(body or b'{}').get('path')
                    p = inside(root, rel)
                    if not p.endswith('.com') or not os.path.isfile(p):
                        return self.reply(400, 'only existing .com scripts inside the working folder can be run')
                    jid = secrets.token_hex(8); JOBS[jid] = Job(script=p)
                    return self.reply(200, {'id': jid})
                if u.path == '/exec':
                    try:
                        return self.exec_line(root, json.loads(body or b'{}'))
                    except (PermissionError, ValueError) as e:   # a refused command is a normal answer for the terminal
                        return self.reply(200, {'error': str(e)})
                if u.path == '/kill':
                    j = JOBS.get(json.loads(body or b'{}').get('id', ''))
                    if not j:
                        return self.reply(404, 'no such job')
                    j.kill(); return self.reply(200, {'ok': True})
                return self.reply(404, 'unknown endpoint')
            except PermissionError as e:
                return self.reply(403, str(e))
            except Exception as e:
                return self.reply(400, str(e))
    return H


def main():
    import argparse
    ap = argparse.ArgumentParser(description='UCSFViewer Pro helper: run NMRPipe for the browser app, inside one working folder.')
    ap.add_argument('folder', help='the working directory (contains fid/, ucsf/, peaks/, seq/, save/)')
    ap.add_argument('--port', type=int, default=8765, help='first port to try (default 8765)')
    ap.add_argument('--init', help='NMRPipe init file to source (e.g. ~/nmrpipe/com/nmrInit.mac11_64.com) if nmrPipe is not on PATH')
    a = ap.parse_args(); port = a.port
    root = os.path.realpath(os.path.expanduser(a.folder))
    if not os.path.isdir(root):
        print('Not a folder:', root); sys.exit(1)
    token = secrets.token_urlsafe(24)
    srv = None
    for p in range(port, port + 20):
        try:
            srv = ThreadingHTTPServer(('127.0.0.1', p), make_handler(root, token)); port = p; break
        except OSError:
            continue
    if not srv:
        print('No free port near', port); sys.exit(1)
    info = os.path.join(root, 'ucsfpro-helper.json')
    with open(info, 'w') as fh:
        json.dump({'port': port, 'token': token, 'started': time.strftime('%Y-%m-%d %H:%M:%S')}, fh)
    try:
        os.chmod(info, 0o600)
    except OSError:
        pass
    src = load_nmrpipe_env(a.init)
    missing = [t for t in TOOLS if not shutil.which(t)]
    print('UCSFViewer Pro helper %s on http://127.0.0.1:%d for %s' % (VERSION, port, root))
    print('NMRPipe tools missing from PATH: ' + ', '.join(missing) if missing else 'NMRPipe tools found (environment: %s).' % src)
    if 'nmrPipe' in missing:
        print('  -> start it from a terminal where nmrPipe works, or pass --init /path/to/nmrpipe/com/nmrInit.<platform>.com')
    print('Open the working folder in the app (or press "check"). Ctrl+C to stop.')
    try:
        srv.serve_forever()
    except KeyboardInterrupt:
        pass
    finally:
        try:
            os.remove(info)
        except OSError:
            pass


if __name__ == '__main__':
    main()

#!/bin/bash
# UCSFViewer Pro — double-click to start the NMRPipe helper (macOS).
# Keep this file next to ucsfpro_helper.py. It asks for the working folder (the one with fid/, ucsf/ …),
# remembers it for next time, loads your NMRPipe environment and starts the helper.
# Close this Terminal window (or press Ctrl+C) to stop the helper.

HERE="$(cd "$(dirname "$0")" && pwd)"
HELPER="$HERE/ucsfpro_helper.py"
LAST="$HOME/.ucsfpro_helper_last"
pause() { echo; read -r -n 1 -s -p "Press any key to close this window." ; echo; }

echo "UCSFViewer Pro — NMRPipe helper"
echo "--------------------------------"

if [ ! -f "$HELPER" ]; then
  echo "ucsfpro_helper.py was not found next to this file:"; echo "  $HERE"
  echo "Put both files in the same folder (the app can save ucsfpro_helper.py for you)."; pause; exit 1
fi

PY="$(command -v python3)"
if [ -z "$PY" ] || ! "$PY" -c 'import sys; sys.exit(0 if sys.version_info >= (3, 7) else 1)' 2>/dev/null; then
  echo "python3 (3.7 or newer) is needed. On macOS: run  xcode-select --install  in Terminal, or install Python from python.org."
  pause; exit 1
fi

# working folder: argument > this file's own folder if it is a working folder > folder dialog (last choice preselected)
WD="$1"
if [ -z "$WD" ] && { [ -d "$HERE/fid" ] || [ -d "$HERE/ucsf" ]; }; then WD="$HERE"; fi
if [ -z "$WD" ]; then
  DEF=""; [ -f "$LAST" ] && DEF="$(cat "$LAST")"
  [ -d "$DEF" ] || DEF="$HOME"
  WD="$(osascript - "$DEF" <<'APPLESCRIPT' 2>/dev/null
on run argv
  set p to "UCSFViewer Pro: choose the working folder (it contains fid/, ucsf/, peaks/ …)"
  try
    set d to (POSIX file (item 1 of argv)) as alias
    return POSIX path of (choose folder with prompt p default location d)
  on error number n
    if n is -128 then return ""
    return POSIX path of (choose folder with prompt p)
  end try
end run
APPLESCRIPT
)"
fi
if [ -z "$WD" ]; then echo "No working folder chosen."; pause; exit 1; fi
WD="${WD%/}"
if [ ! -d "$WD" ]; then echo "Not a folder: $WD"; pause; exit 1; fi
printf '%s\n' "$WD" > "$LAST"

echo "Working folder: $WD"
echo
# The helper loads the NMRPipe environment itself if nmrPipe is not on PATH
# (~/.cshrc, ~/.tcshrc, login zsh/bash, or nmrInit*.com in ~/nmrpipe, /opt/nmrpipe …).
# If your NMRPipe lives elsewhere, set it here, e.g.:
# export NMRPIPE_INIT="$HOME/nmrpipe/com/nmrInit.mac11_64.com"
"$PY" "$HELPER" "$WD"
code=$?
echo; echo "Helper stopped (exit $code)."
pause

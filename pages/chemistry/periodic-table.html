<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interactive Periodic Table · Element Properties</title>
<style>
  :root{
    --surface-1:#fcfcfb; --page:#f9f9f7;
    --text-primary:#0b0b0b; --text-secondary:#52514e; --muted:#898781;
    --grid:#e1e0d9; --baseline:#c3c2b7; --border:rgba(11,11,11,0.10);
    --seq:#2a78d6; --seq-lite:#cde2fb;
    --pos:#e34948; --neg:#2a78d6;
    --btn-bg:#ffffff; --btn-active:#0b0b0b; --btn-active-fg:#ffffff;
    --cell:#f4f3ef; --chip:#f1f0ec;
    /* categorical slots (validated palette) */
    --k1:#2a78d6; --k2:#eb6834; --k3:#1baf7a; --k4:#eda100;
    --k5:#e87ba4; --k6:#008300; --k7:#4a3aa7; --k8:#e34948;
  }
  html[data-theme="dark"]{
    --surface-1:#1a1a19; --page:#0d0d0d;
    --text-primary:#ffffff; --text-secondary:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --baseline:#383835; --border:rgba(255,255,255,0.12);
    --seq:#3987e5; --seq-lite:#184f95;
    --pos:#e66767; --neg:#3987e5;
    --btn-bg:#242422; --btn-active:#ffffff; --btn-active-fg:#0b0b0b;
    --cell:#242422; --chip:#2a2a28;
    --k1:#3987e5; --k2:#d95926; --k3:#199e70; --k4:#c98500;
    --k5:#d55181; --k6:#008300; --k7:#9085e9; --k8:#e66767;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--page); color:var(--text-primary);
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif; padding:16px 16px 44px;}
  .container{max-width:1220px; margin:0 auto;}
  h1{font-size:20px; margin:0 0 2px; letter-spacing:.2px;}
  .sub{color:var(--text-secondary); font-size:13px; margin:0;}
  .toprow{display:flex; align-items:flex-start; gap:12px;}
  .toprow .spacer{flex:1;}
  .theme,.lang{border:1px solid var(--border); background:var(--btn-bg); color:var(--text-secondary);
    padding:7px 12px; border-radius:9px; font-size:13px; cursor:pointer; white-space:nowrap;}
  .lang{font-weight:600; color:var(--text-primary);}
  /* button rows */
  .rowlabel{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.6px; margin:14px 0 6px;}
  .btnrow{display:flex; flex-wrap:wrap; gap:7px; align-items:center;}
  .btn{border:1px solid var(--border); background:var(--btn-bg); color:var(--text-primary);
    padding:6px 11px; border-radius:9px; font-size:12.5px; cursor:pointer; line-height:1.15;
    transition:.12s; white-space:nowrap;}
  .btn small{display:block; color:var(--muted); font-size:10px; margin-top:1px;}
  .btn:hover{border-color:var(--baseline);}
  .btn.active{background:var(--btn-active); color:var(--btn-active-fg); border-color:var(--btn-active);}
  .btn.active small{color:rgba(255,255,255,.72);}
  html[data-theme="dark"] .btn.active small{color:rgba(0,0,0,.6);}
  .grp.active{background:var(--btn-active); color:var(--btn-active-fg); border-color:var(--btn-active);}
  /* sub-chip row */
  #subrow{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; padding:8px; border:1px dashed var(--border);
    border-radius:11px; background:var(--chip); min-height:0;}
  #subrow:empty{display:none;}
  .chip{border:1px solid var(--border); background:var(--btn-bg); color:var(--text-primary);
    padding:5px 10px; border-radius:8px; font-size:12px; cursor:pointer; transition:.12s;}
  .chip:hover{border-color:var(--baseline);}
  .chip.active{background:var(--seq); color:#fff; border-color:var(--seq);}
  /* explanation */
  .explain{margin:12px 0 4px; padding:11px 14px; border-radius:11px; background:var(--surface-1);
    border:1px solid var(--border); font-size:13.5px; line-height:1.55; color:var(--text-primary);}
  .explain b{color:var(--seq);}
  .explain .note{color:var(--muted); font-size:12px;}
  /* legend */
  .legend{min-height:26px; display:flex; align-items:center; gap:14px; flex-wrap:wrap;
    font-size:12.5px; color:var(--text-secondary); margin:8px 2px 6px;}
  .legend .gradbar{width:130px; height:12px; border-radius:6px; border:1px solid var(--border);}
  .legend .sw{display:inline-block; width:13px; height:13px; border-radius:3px; vertical-align:-2px; margin-right:5px;}
  .legend b{color:var(--text-primary); font-weight:600;}
  /* grid */
  .wrap{overflow-x:auto;}
  .grid{display:grid; grid-template-columns:repeat(18,1fr); gap:3px; min-width:940px;}
  .cell{position:relative; aspect-ratio:1/1; border-radius:6px; background:var(--cell);
    border:1px solid var(--border); overflow:hidden;}
  .cell .num{position:absolute; top:2px; left:4px; font-size:8.5px; color:var(--muted); z-index:3;}
  .cell .sym{position:absolute; top:44%; left:0; right:0; transform:translateY(-50%); text-align:center;
    font-size:15px; font-weight:700; z-index:3; text-shadow:0 1px 2px rgba(0,0,0,.14);}
  html[data-theme="dark"] .cell .sym{text-shadow:0 1px 2px rgba(0,0,0,.55);}
  .cell .val{position:absolute; bottom:1px; left:0; right:0; text-align:center; font-size:7.6px;
    color:var(--text-secondary); z-index:3; font-variant-numeric:tabular-nums; padding:0 1px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .cell.center .sym{top:50%;}
  .cell.nodata{opacity:.4;}
  .mark{position:absolute; inset:0; z-index:1;}
  .mark .bar{position:absolute; bottom:0; left:50%; transform:translateX(-50%); width:42%;
    border-radius:4px 4px 0 0; background:var(--seq);}
  .mark .divpos{position:absolute; left:50%; transform:translateX(-50%); bottom:50%; width:42%;
    border-radius:4px 4px 0 0; background:var(--pos);}
  .mark .divneg{position:absolute; left:50%; transform:translateX(-50%); top:50%; width:42%;
    border-radius:0 0 4px 4px; background:var(--neg);}
  .mark .midline{position:absolute; left:8%; right:8%; top:50%; height:1px; background:var(--baseline);}
  .mark .circle{position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); border-radius:50%;
    background:var(--seq); opacity:.85;}
  .mark .square{position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); border-radius:3px;
    background:var(--seq); opacity:.85;}
  .cell .cfgtxt{position:absolute; bottom:1px; left:1px; right:1px; text-align:center; font-size:6.4px;
    line-height:1.05; color:var(--text-secondary); z-index:3;}
  /* category tints */
  .c-alkali{background:#f6d7b0;} .c-alkaline{background:#f3e6a8;} .c-trans{background:#f6c9c9;}
  .c-post{background:#cfe3c6;} .c-metalloid{background:#c7e6e2;} .c-nonmetal{background:#bcd6f2;}
  .c-halogen{background:#d7c8ee;} .c-noble{background:#eecbe0;}
  html[data-theme="dark"] .c-alkali{background:#5a4326;} html[data-theme="dark"] .c-alkaline{background:#5a5326;}
  html[data-theme="dark"] .c-trans{background:#5a2f2f;} html[data-theme="dark"] .c-post{background:#2f4a2a;}
  html[data-theme="dark"] .c-metalloid{background:#245450;} html[data-theme="dark"] .c-nonmetal{background:#26466e;}
  html[data-theme="dark"] .c-halogen{background:#3f2f5c;} html[data-theme="dark"] .c-noble{background:#5a2f49;}
  /* tooltip */
  #tip{position:fixed; z-index:50; pointer-events:none; opacity:0; transition:opacity .1s;
    background:var(--surface-1); color:var(--text-primary); border:1px solid var(--border);
    border-radius:9px; padding:9px 11px; font-size:12px; box-shadow:0 8px 26px rgba(0,0,0,.18);
    max-width:250px; line-height:1.5;}
  #tip h4{margin:0 0 4px; font-size:13px;}
  #tip .r{display:flex; justify-content:space-between; gap:14px; color:var(--text-secondary);}
  #tip .r b{color:var(--text-primary); font-weight:600; font-variant-numeric:tabular-nums;}
  #tip .r.hl b{color:var(--seq);}
  #tip .ionseq{margin-top:7px; padding-top:7px; border-top:1px solid var(--border);}
  #tip .ionseq .cap{color:var(--muted); font-size:10.5px; margin-bottom:5px;}
  #tip .ions{display:flex; align-items:flex-end; gap:9px;}
  #tip .ionitem{display:flex; flex-direction:column; align-items:center; gap:2px;}
  #tip .ionitem .dot{border-radius:50%; background:var(--seq);}
  #tip .ionitem.atom .dot{background:var(--muted);}
  #tip .ionitem .q{font-size:10px; font-weight:700; color:var(--text-primary);}
  #tip .ionitem .rr{font-size:9.5px; color:var(--text-secondary); font-variant-numeric:tabular-nums;}
  footer{margin:22px auto 0; color:var(--muted); font-size:11.5px; line-height:1.6;}
  .catleg{display:flex; flex-wrap:wrap; gap:9px 15px; font-size:11.5px; color:var(--text-secondary); margin-top:4px;}
  .catleg span i{display:inline-block; width:12px; height:12px; border-radius:3px; vertical-align:-2px; margin-right:5px;}
</style>
</head>
<body>
<div class="container">
  <div class="toprow">
    <div>
      <h1 id="title">Interactive Periodic Table</h1>
      <p class="sub" id="subtitle">Element properties visualized. Data: NYS Chemistry Reference Tables (2011) Periodic Table &amp; Table S, extended with standard chemical data.</p>
    </div>
    <div class="spacer"></div>
    <button class="lang" id="langBtn">中文</button>
    <button class="theme" id="themeBtn">🌓</button>
  </div>

  <div class="rowlabel" id="lbl-basic">Quick views</div>
  <div class="btnrow" id="basicRow"></div>

  <div class="rowlabel" id="lbl-groups">Property categories</div>
  <div class="btnrow" id="groupRow"></div>
  <div id="subrow"></div>

  <div class="explain" id="explain"></div>
  <div class="legend" id="legend"></div>

  <div class="wrap"><div class="grid" id="grid"></div></div>

  <div id="tip"></div>

  <footer>
    <div id="catleg" class="catleg"></div>
    <p id="footnote" style="margin-top:10px"></p>
  </footer>
</div>

function irMain(d){ const e=IONS[d.s]; if(!e) return null; const m=e.ions.find(x=>x.q===e.main); return m?m.r:null; }
function ionSeq(d){ // returns list ordered negative→zero→positive incl. neutral atom
  const e=IONS[d.s]; const arr=[];
  if(e) e.ions.forEach(x=>arr.push({q:x.q,r:x.r}));
  if(d.ar!=null) arr.push({q:0,r:d.ar});
  arr.sort((a,b)=>a.q-b.q);
  return arr;
}
function chargeLabel(q){ if(q===0) return "0"; return (q>0?"+":"")+q; }

/* ================= computed helpers ================= */
function metChar(d){ // 0..1 metallic-character proxy from position
  const g = d.col; const p = d.row;
  return Math.max(0,Math.min(1, 0.45*(p-1)/6 + 0.55*(18-g)/17));
}
function npRatio(d){ return d.aiso? (d.aiso - d.n)/d.n : null; }

  radio:{group:"g6", en:"Radioactive vs stable", zh:"放射性 / 稳定", type:"catv", cv:"radio", get:d=>d.radio?"radio":"stable",
    ex:{en:"Whether the element has any stable isotope. Everything past bismuth (and technetium/promethium) is radioactive — the nucleus can't hold together forever.",
        zh:"元素是否存在稳定同位素。铋之后（以及锝/钷）全为放射性 —— 原子核无法永久稳定。"}},
  half:{group:"g6", en:"Half-life (longest-lived)", zh:"半衰期（最长寿）", type:"text", get:d=>d.radio?(d.half||"—"):"stable",
    ex:{en:"For radioactive elements, how long the most stable isotope takes to decay by half — from seconds to billions of years. Stable elements show 'stable'.",
        zh:"对放射性元素，其最稳定同位素衰变一半所需时间 —— 从几秒到数十亿年。稳定元素显示 'stable'。"}},
  block:{group:"g6", en:"Valence orbital (s/p/d/f)", zh:"价层轨道 (s/p/d/f)", type:"catv", cv:"block", get:d=>blockOf(d),
    ex:{en:"Which type of orbital the highest-energy (valence) electrons occupy — the element's 'block'. s-block = groups 1–2, p-block = groups 13–18, d-block = transition metals, f-block = lanthanides/actinides (omitted here). The block sets the shape of the periodic table and the family's chemistry.",
        zh:"最高能量（价）电子所占据的轨道类型 —— 即元素所在的“区”。s 区 = 第 1–2 族，p 区 = 第 13–18 族，d 区 = 过渡金属，f 区 = 镧系/锕系（此处未含）。区决定了周期表的形状和该族的化学性质。"}},
  ncap:{group:"g6", en:"Neutron capture cross section", zh:"中子俘获截面", type:"note",
    ex:{en:"How likely a nucleus is to absorb a passing neutron — critical for nuclear reactors (boron and cadmium are strong absorbers used in control rods). Values vary enormously with neutron energy, so per-element numbers aren't listed.",
        zh:"原子核俘获掠过中子的可能性 —— 对核反应堆至关重要（硼、镉吸收强，用于控制棒）。数值随中子能量剧烈变化，故未逐元素列出。"}},

  /* ---- group 7: biological / environmental ---- */
  bio:{group:"g7", en:"Biological role", zh:"生物学作用", type:"catv", cv:"bio", get:d=>d.bio,
    ex:{en:"Whether life needs the element: bulk-essential (C, O, Ca…), essential trace (Fe, Zn, I…), possibly essential, or no known role. A rough consensus view.",
        zh:"生命是否需要该元素：宏量必需（C、O、Ca……）、微量必需（Fe、Zn、I……）、可能必需，或无已知作用。为大致共识。"}},
  body:{group:"g7", en:"Abundance in human body", zh:"人体丰度", type:"bar", unit:"mass %", get:d=>d.body?d.body*100:null, dec:2,
    ex:{en:"Fraction of body mass. Oxygen (65%), carbon (18%) and hydrogen (10%) dominate; only major elements are charted here, the rest are trace.",
        zh:"占体重的比例。氧（65%）、碳（18%）、氢（10%）为主；此处只标出主要元素，其余为微量。"}},
  tox:{group:"g7", en:"Toxicity", zh:"毒性", type:"catv", cv:"tox", get:d=>d.tox,
    ex:{en:"Broad hazard of the element/common compounds: non-toxic, low, or toxic (heavy metals like Pb, Hg, Cd, Tl, and radiotoxic elements). A simplified guide only.",
        zh:"元素/常见化合物的大致危害：无毒、低毒或有毒（铅、汞、镉、铊等重金属及放射性元素）。仅为简化指引。"}},
  ld50:{group:"g7", en:"LD50", zh:"半数致死量 LD50", type:"note",
    ex:{en:"The dose lethal to half a test population. It is NOT a property of an element — it depends entirely on the chemical compound, its solubility, and the route of exposure (e.g. metallic mercury vs. methylmercury differ by orders of magnitude). For that reason no single per-element value is meaningful, so none is shown.",
        zh:"使受试群体半数致死的剂量。它并非元素的属性 —— 完全取决于具体化合物、溶解度和接触途径（如金属汞与甲基汞相差多个数量级）。因此单一的逐元素数值没有意义，故不显示。"}},
  enzyme:{group:"g7", en:"Enzyme cofactor frequency", zh:"酶辅因子频率", type:"note",
    ex:{en:"How often the element appears as a cofactor in enzymes. Zinc, magnesium, and iron are the workhorses of metalloenzymes; a precise 'frequency' isn't a standardized, tabulated number, so it's described qualitatively rather than charted.",
        zh:"元素作为酶辅因子出现的频率。锌、镁、铁是金属酶的主力；精确的“频率”并非标准化列表数值，故以定性描述而非图表呈现。"}},
};
function norm(v,mn,mx){ if(v==null) return 0; return Math.max(0,Math.min(1,(v-mn)/(mx-mn))); }

/* group definitions */
const GROUPS = [
  {id:"gR", en:"Atomic / ionic radius", zh:"原子 / 离子半径", props:["ar","ir"], hidden:true},
  {id:"g1", en:"Electronic structure", zh:"电子结构",
   props:["cfg","val","vshell","unp","ie1","ie2","ea1","eneg1"]},
  {id:"g2", en:"Chemical reactivity", zh:"化学反应性",
   props:["ox","oxmax","oxmin","ion","metchar","reduce","oxidize","rw","ro","oxide"]},
  {id:"g3", en:"Metallic / nonmetallic", zh:"金属性与非金属性",
   props:["metchar3","nonmet","t3","econd","tcond"]},
  {id:"g4", en:"Thermodynamic", zh:"热力学",
   props:["hcap","hfus","hvap","hatom","S0","coh"]},
  {id:"g5", en:"Electrical / magnetic", zh:"电学 / 磁学",
   props:["econd5","res","wf","sc","mag","suscept"]},
  {id:"g6", en:"Nuclear", zh:"核性质",
   props:["iso","aiso","np","radio","half","block","ncap"]},
  {id:"g7", en:"Biological / environmental", zh:"生物与环境",
   props:["bio","body","tox","ld50","enzyme"]},
];
const BASIC = ["category","ar","ie","eneg","ea","mp","bp","den"];

/* ================= state + rendering ================= */
let active = "category";
let openGroup = null;

const basicRow=document.getElementById("basicRow");
const groupRow=document.getElementById("groupRow");
const subrow=document.getElementById("subrow");
const grid=document.getElementById("grid");
const legend=document.getElementById("legend");
const explain=document.getElementById("explain");
const tip=document.getElementById("tip");

function lbl(p){ return P[p][LANG]; }
function exOf(pid){ const p=P[pid]; const src=p.exRef?P[p.exRef]:p; return src.ex?src.ex[LANG]:""; }

function buildButtons(){
  basicRow.innerHTML="";
  BASIC.forEach(pid=>{
    const b=document.createElement("button");
    if(pid==="ar"){ // atomic radius opens the radius group (atomic + ionic branches)
      b.className="btn"+(openGroup==="gR"?" active":"");
      b.innerHTML=`${P.ar[LANG]}`;
      b.onclick=()=>{ openGroup="gR"; active="ar"; render(); };
    } else {
      b.className="btn"+((active===pid&&!openGroup)?" active":"");
      b.innerHTML=`${P[pid][LANG]}`;
      b.onclick=()=>{ active=pid; openGroup=null; render(); };
    }
    basicRow.appendChild(b);
  });
  groupRow.innerHTML="";
  GROUPS.filter(g=>!g.hidden).forEach(g=>{
    const b=document.createElement("button");
    b.className="btn grp"+(openGroup===g.id?" active":"");
    b.innerHTML=`${g[LANG]}`;
    b.onclick=()=>{ openGroup=g.id; active=g.props[0]; render(); };
    groupRow.appendChild(b);
  });
}
function buildSubrow(){
  subrow.innerHTML="";
  if(!openGroup){ return; }
  const g=GROUPS.find(x=>x.id===openGroup);
  g.props.forEach(pid=>{
    const c=document.createElement("button");
    c.className="chip"+(active===pid?" active":"");
    c.textContent=P[pid][LANG];
    c.onclick=()=>{ active=pid; render(); };
    subrow.appendChild(c);
  });
}

function extent(getter){ let mn=Infinity,mx=-Infinity;
  D.forEach(d=>{const v=getter(d); if(v!=null&&!isNaN(v)){mn=Math.min(mn,v);mx=Math.max(mx,v);}});
  return [mn,mx];
}
function blockOf(d){ // s,p,d
  if(d.col<=2 || d.n===2) return "s";
  if(d.col>=13) return "p";
  return "d";
}
const BLOCKCOL={s:"var(--k2)",p:"var(--k1)",d:"var(--k7)",f:"var(--k5)"};

function render(){
  buildButtons(); buildSubrow();
  const p=P[active];
  // explanation
  explain.innerHTML = `<b>${p[LANG]}</b>${p.unit?` <span class="note">(${p.unit})</span>`:""} — ${exOf(active)}`;
  grid.innerHTML="";
  let ext=null, posMax=1, negMax=1;
  if(["bar","circle","square","trend"].includes(p.type)) ext=extent(p.get);
  if(p.type==="div"){ D.forEach(d=>{const v=p.get(d); if(v!=null){ if(v>=0)posMax=Math.max(posMax,v); else negMax=Math.max(negMax,-v);} }); }

  D.forEach(d=>{
    const cell=document.createElement("div");
    cell.className="cell"; cell.style.gridColumn=d.col; cell.style.gridRow=d.row;
    let valStr=null;
    if(p.type==="cat"){ cell.classList.add("c-"+d.cat); cell.classList.add("center"); }
    else if(p.type==="note"){ cell.classList.add("nodata"); cell.classList.add("center"); }
    else {
      const raw = p.get? p.get(d) : null;
      if(p.type==="catv"){
        const key=raw; const cv=CV[p.cv];
        if(key!=null && cv.colors[key]){ const m=document.createElement("div"); m.className="mark";
          m.style.background=cv.colors[key]; m.style.opacity=.85; cell.appendChild(m);
          if(p.cv==="block"){ valStr=key; } else { cell.classList.add("center"); }
        } else { cell.classList.add("nodata"); cell.classList.add("center"); }
      } else if(p.type==="text"){
        if(raw==null||raw===""){ cell.classList.add("nodata"); }
        cell.classList.add("center");
        if(active==="cfg" && raw){ // color by block, show config small
          const bl=blockOf(d); const m=document.createElement("div"); m.className="mark";
          m.style.background=BLOCKCOL[bl]; m.style.opacity=.16; cell.appendChild(m);
        }
        valStr = raw==null?"—":raw;
      } else if(raw==null||isNaN(raw)){ cell.classList.add("nodata"); }
      else {
        const mark=document.createElement("div"); mark.className="mark";
        if(p.type==="bar"||p.type==="trend"){
          const t=(raw-ext[0])/((ext[1]-ext[0])||1); const h=12+t*76;
          const b=document.createElement("div"); b.className="bar"; b.style.height=h+"%"; mark.appendChild(b);
        } else if(p.type==="div"){
          const ml=document.createElement("div"); ml.className="midline"; mark.appendChild(ml);
          if(raw>=0){ const b=document.createElement("div"); b.className="divpos"; b.style.height=(6+(raw/posMax)*44)+"%"; mark.appendChild(b); }
          else { const b=document.createElement("div"); b.className="divneg"; b.style.height=(6+(-raw/negMax)*44)+"%"; mark.appendChild(b); }
        } else if(p.type==="circle"){
          const t=(raw-ext[0])/((ext[1]-ext[0])||1); const dia=22+t*66;
          const c=document.createElement("div"); c.className="circle"; c.style.width=dia+"%"; c.style.height=dia+"%"; mark.appendChild(c);
        } else if(p.type==="square"){
          const t=Math.sqrt(raw/(ext[1]||1)); const side=14+t*72;
          const sq=document.createElement("div"); sq.className="square"; sq.style.width=side+"%"; sq.style.height=side+"%"; mark.appendChild(sq);
        }
        cell.appendChild(mark);
        if(p.type!=="trend"){ const dec=p.dec??((Math.abs(raw)>=100)?0:1); valStr=(+raw).toFixed(dec).replace(/\.0$/,""); }
      }
    }
    cell.innerHTML += `<span class="num">${d.n}</span><span class="sym">${d.s}</span>`;
    if(active==="cfg"){ if(d.cfg) cell.innerHTML+=`<span class="cfgtxt">${d.cfg}</span>`; }
    else if(valStr!=null && p.type!=="cat"){ cell.innerHTML+=`<span class="val">${valStr}</span>`; }
    cell.addEventListener("mousemove",e=>showTip(e,d));
    cell.addEventListener("mouseleave",hideTip);
    grid.appendChild(cell);
  });
  drawLegend(p,ext,posMax,negMax);
  drawCatLeg();
  // texts
  document.getElementById("title").textContent=t("title");
  document.getElementById("subtitle").textContent=t("subtitle");
  document.getElementById("lbl-basic").textContent=t("quick");
  document.getElementById("lbl-groups").textContent=t("cats");
  document.getElementById("langBtn").textContent=t("langBtn");
  document.getElementById("footnote").innerHTML = LANG==="en"
    ? "Melting/boiling converted to °C (°C = K − 273). Trend properties (metallic character, reducing/oxidizing ability, nonmetallic character) are periodic-position estimates, not measured values. Categorical calls (reactivity, oxide, toxicity, biological role, magnetic ordering) are simplified teaching classifications. Elements 58–71 and 90+ are omitted from Table S and left blank. Extended numeric data are standard reference approximations; a few properties (LD50, enzyme cofactor frequency, magnetic susceptibility, neutron cross-section, cohesive energy, atomization enthalpy) are described but not charted per element."
    : "熔点/沸点换算为 °C（°C = K − 273）。趋势性质（金属性、还原/氧化能力、非金属性）为按周期位置的估计值，非实测。分类判定（反应性、氧化物酸碱、毒性、生物作用、磁性）为简化的教学分类。元素 58–71 及 90 以上在 Table S 中未列出，留空。补充的数值为标准参考近似值；少数性质（LD50、酶辅因子频率、磁化率、中子俘获截面、内聚能、原子化焓）仅作说明，未逐元素作图。";
}

function drawLegend(p,ext,posMax,negMax){
  let html="";
  if(p.type==="cat"||p.type==="note"){ legend.innerHTML=""; return; }
  if(p.type==="catv"){
    const cv=CV[p.cv];
    html = cv.order.map(k=>`<span><span class="sw" style="background:${cv.colors[k]}"></span>${cv.labels[k][LANG]}</span>`).join("");
    legend.innerHTML=html; return;
  }
  if(p.type==="text"){
    if(active==="cfg"){ html=`<span>${LANG==="en"?"tint = block:":"底色 = 区："} <span class="sw" style="background:var(--k2)"></span>s <span class="sw" style="background:var(--k1)"></span>p <span class="sw" style="background:var(--k7)"></span>d</span>`; }
    legend.innerHTML=html; return;
  }
  if(p.type==="trend"){
    html=`<span><span class="gradbar" style="background:linear-gradient(90deg,var(--seq-lite),var(--seq))"></span> ${LANG==="en"?"taller = stronger (periodic-trend estimate)":"柱越高 = 越强（周期趋势估计）"}</span>`;
    legend.innerHTML=html; return;
  }
  if(p.type==="bar"){ html=`<span><span class="gradbar" style="background:linear-gradient(90deg,var(--seq-lite),var(--seq))"></span> ${t("higher")}</span><span>${t("range")} <b>${fmt(ext[0])} → ${fmt(ext[1])}</b></span>`; }
  else if(p.type==="circle"){ html=`<span>${t("circleBig")}</span><span>${t("range")} <b>${fmt(ext[0])} → ${fmt(ext[1])} pm</b></span>`; }
  else if(p.type==="square"){ html=`<span>${t("squareBig")}</span><span>${t("range")} <b>${fmt(ext[0])} → ${fmt(ext[1])}</b></span>`; }
  else if(p.type==="div"){ html=`<span><span class="sw" style="background:var(--pos)"></span>${t("above0")}　<span class="sw" style="background:var(--neg)"></span>${t("below0")}</span><span>${t("max")} <b>${Math.round(posMax)}</b>　${t("min")} <b>−${Math.round(negMax)}</b></span>`; }
  legend.innerHTML=html;
}
function fmt(x){ if(x==null) return "—"; return Math.abs(x)>=100?Math.round(x):Math.round(x*100)/100; }

function drawCatLeg(){
  const el=document.getElementById("catleg");
  if(active==="category"){ el.innerHTML=Object.entries(CATS).map(([k,v])=>`<span><i class="c-${k}"></i>${v[LANG]}</span>`).join(""); }
  else el.innerHTML="";
}

/* tooltip */
function trow(label,val,unit,hl){ return `<div class="r ${hl?'hl':''}"><span>${label}</span><b>${val==null?"—":val}${val==null?"":unit}</b></div>`; }
function showTip(e,d){
  const mpC=d.mp==null?null:d.mp-273, bpC=d.bp==null?null:d.bp-273;
  const L=LANG;
  tip.innerHTML=`<h4>${d.n} · ${d.s} · ${L==="en"?d.nEn:d.nZh+" "+d.nEn}</h4>`+
    `<div style="color:var(--muted);margin-bottom:5px">${CATS[d.cat][L]} · ${d.cfg}</div>`+
    trow(L==="en"?"Atomic radius":"原子半径",d.ar," pm",active==="ar")+
    trow(L==="en"?"1st ionization":"第一电离能",d.ie," kJ/mol",active==="ie"||active==="ie1")+
    trow(L==="en"?"Electronegativity":"电负性",d.eneg,"",active==="eneg"||active==="eneg1")+
    trow(L==="en"?"Oxidation states":"氧化态",d.ox,"",active==="ox")+
    trow(L==="en"?"Melting":"熔点",mpC==null?null:Math.round(mpC)," °C",active==="mp")+
    trow(L==="en"?"Boiling":"沸点",bpC==null?null:Math.round(bpC)," °C",active==="bp")+
    trow(L==="en"?"Density":"密度",d.den," g/cm³",active==="den")+
    trow(L==="en"?"Stable isotopes":"稳定同位素",d.iso,"",active==="iso")+
    trow(L==="en"?"Biological role":"生物作用",CV.bio.labels[d.bio]?CV.bio.labels[d.bio][L]:d.bio,"",active==="bio");
  // ionic radius sequence when radius group active
  if(P[active]&&P[active].ionHover){
    const seq=ionSeq(d);
    if(seq.length){
      const maxr=Math.max(...seq.map(x=>x.r),1);
      const items=seq.map(x=>{ const px=Math.max(8, Math.round((x.r/maxr)*34));
        const isAtom=x.q===0;
        const qlab=isAtom?(L==="en"?"atom":"原子"):(d.s+" "+chargeLabel(x.q));
        return `<div class="ionitem ${isAtom?'atom':''}"><div class="dot" style="width:${px}px;height:${px}px"></div><div class="q">${isAtom?chargeLabel(0):chargeLabel(x.q)}</div><div class="rr">${x.r}</div></div>`;
      }).join("");
      tip.innerHTML += `<div class="ionseq"><div class="cap">${L==="en"?"Radii (pm): negative → 0 → positive":"半径 (pm)：负 → 0 → 正"}</div><div class="ions">${items}</div></div>`;
    }
  }
  tip.style.opacity=1;
  const pad=14,w=tip.offsetWidth,h=tip.offsetHeight; let x=e.clientX+pad,y=e.clientY+pad;
  if(x+w>innerWidth)x=e.clientX-w-pad; if(y+h>innerHeight)y=e.clientY-h-pad;
  tip.style.left=x+"px"; tip.style.top=y+"px";
}
function hideTip(){ tip.style.opacity=0; }

document.getElementById("langBtn").onclick=()=>{ LANG=LANG==="en"?"zh":"en"; document.documentElement.lang=LANG; render(); };
document.getElementById("themeBtn").onclick=()=>{ const h=document.documentElement; h.dataset.theme=h.dataset.theme==="dark"?"light":"dark"; render(); };

render();
</script>
</body>
</html>

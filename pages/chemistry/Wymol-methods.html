<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wymol interaction model v1.3 · Methods</title>
<style>
:root{--bg:#f7f7f4;--surface:#fff;--ink:#101010;--muted:#66645f;--border:#deddd6;--accent:#4a3aa7;--code:#f1f0eb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{max-width:900px;margin:auto;padding:36px 22px 80px}header{border-bottom:1px solid var(--border);padding-bottom:24px;margin-bottom:28px}h1{margin:0 0 5px;font-size:2rem}h2{font-size:1.25rem;margin:0 0 8px}.meta,.level{color:var(--accent);font-size:.75rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em}.lede,.limits{color:var(--muted)}nav{display:flex;gap:7px;flex-wrap:wrap;margin-top:18px}nav a{border:1px solid var(--border);border-radius:999px;padding:4px 10px;text-decoration:none;color:var(--muted);font-size:.75rem;background:var(--surface)}article,.guide{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px;margin:14px 0;scroll-margin-top:14px}.guide{margin:24px 0}.guide h2{font-size:1.45rem}.guide h3{font-size:1rem;margin:18px 0 5px}.guide code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;background:var(--code);border-radius:5px;padding:2px 5px}.guide table{width:100%;border-collapse:collapse;margin:12px 0}.guide th,.guide td{text-align:left;border-bottom:1px solid var(--border);padding:8px;vertical-align:top}.formula{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;background:var(--code);border-radius:9px;padding:11px;overflow:auto}.unit{font-size:.75rem;color:var(--muted)}.refs a{display:block;color:var(--accent);font-size:.82rem;margin:4px 0}.callout{border-left:4px solid var(--accent);padding:10px 14px;background:#eeebff;border-radius:0 9px 9px 0}button{border:1px solid var(--border);border-radius:999px;background:var(--surface);padding:6px 11px;cursor:pointer}footer{color:var(--muted);font-size:.8rem;margin-top:28px}@media(prefers-color-scheme:dark){:root{--bg:#0d0d0d;--surface:#1a1a19;--ink:#fff;--muted:#aaa8a0;--border:#343431;--accent:#a99fff;--code:#242421}.callout{background:#26213c}}
</style>
</head>
<body><main class="wrap"><header><div class="meta" id="version"></div><h1>Wymol Methods</h1><p class="lede">How geometry, estimated pair energies, multi-model occupancy, and secondary-structure interaction load are calculated.</p><button id="lang">中文 / EN</button><nav id="nav"></nav></header><div class="callout" id="scope"></div><section class="guide" id="thermoGuide"></section><section id="entries"></section><footer id="revision"></footer></main>
<script src="wymol-methods-data.js"></script>
<script>
let lang="en"; const db=window.WYMOL_METHODS;
function render(){
 document.documentElement.lang=lang; document.querySelector("#version").textContent=db.version;
 document.querySelector("#scope").innerHTML=lang==="zh"?"<b>解释边界：</b>Wymol v1.3 的 energy 是快速静态坐标估算。除非明确标注，否则它不是 ΔG、完整力场能量或机械应力。":"<b>Interpretation boundary:</b> Wymol v1.3 energies are fast static-coordinate estimates. Unless explicitly stated, they are not ΔG, complete force-field energies, or mechanical stress.";
 document.querySelector("#thermoGuide").innerHTML=lang==="zh"?`<div class="level">核心概念指南</div><h2>从 interaction energy 到 ΔG、Kd 与局部稳定性</h2><h3>1. ΔG 必须比较两个状态</h3><p><code>ΔG = ΔH − TΔS</code>。负 ΔG 只表示已定义的正向过程在给定条件下更有利。单个静态 PDB 片段没有自动对应的“局部 ΔG”；必须定义参考态，例如保持结构与局部展开，并采样溶剂、熵、构象松弛和质子化。</p><h3>2. Kd 描述结合平衡，不描述某段 helix 的稳定性</h3><p><code>Kd=[P][L]/[PL]</code>，且 <code>ΔG°bind=RT ln(Kd/C°)</code>。Kd 越低表示平衡亲和力越强；它不能独自给出折叠稳定性、局部二级结构稳定性或 residence time。</p><h3>3. Wymol 中可以谨慎提出什么</h3><table><tr><th>观察</th><th>合适解释</th></tr><tr><td>一端 boundary load 较高</td><td>该端具有较强的外部锚定</td></tr><tr><td>另一端 boundary load 较低</td><td>该端约束不足，可能更易移动或 fray</td></tr><tr><td>Anchoring asymmetry 较高</td><td>两端外部锚定明显不对称；这是预测性结构启发指标</td></tr></table><p><b>不能据此直接断言：</b>较弱端一定会“飞”、较强端完全静止，或两端数值就是局部 ΔG。应结合 NMR ensemble dispersion、MD RMSF、B-factor、interaction occupancy、局部分辨率或缺失密度验证。</p>`:`<div class="level">Core concept guide</div><h2>From interaction energy to ΔG, Kd, and local stability</h2><h3>1. ΔG must compare two states</h3><p><code>ΔG = ΔH − TΔS</code>. A negative ΔG only favors the explicitly defined forward process under the stated conditions. A segment in one static PDB does not automatically have a “local ΔG”; a reference state—such as structured versus locally unfolded—plus solvent, entropy, relaxation, and protonation sampling is required.</p><h3>2. Kd describes binding equilibrium, not helix stability</h3><p><code>Kd=[P][L]/[PL]</code> and <code>ΔG°bind=RT ln(Kd/C°)</code>. Lower Kd means stronger equilibrium affinity; Kd alone does not report folding stability, local secondary-structure stability, or residence time.</p><h3>3. What Wymol can cautiously suggest</h3><table><tr><th>Observation</th><th>Appropriate interpretation</th></tr><tr><td>Higher boundary load at one end</td><td>That end is more externally anchored</td></tr><tr><td>Lower boundary load at the other end</td><td>That end is underconstrained and may be more mobile or prone to fraying</td></tr><tr><td>High anchoring asymmetry</td><td>External anchoring differs strongly between ends; this is a predictive structural heuristic</td></tr></table><p><b>Do not conclude directly</b> that the weaker end must “fly,” the stronger end is motionless, or either value is a local ΔG. Validate with NMR ensemble dispersion, MD RMSF, B-factors, interaction occupancy, local resolution, or missing density.</p>`;
 const vals=Object.entries(db.entries); document.querySelector("#nav").innerHTML=vals.map(([id,m])=>`<a href="#${id}">${m.title[lang]}</a>`).join("");
 document.querySelector("#entries").innerHTML=vals.map(([id,m])=>`<article id="${id}"><div class="level">${m.level}</div><h2>${m.title[lang]}</h2><p>${m.summary[lang]}</p><div class="formula">${m.formula}<div class="unit">${m.unit}</div></div><p class="limits"><b>${lang==="zh"?"限制":"Limitations"}:</b> ${m.limits[lang]}</p><div class="refs">${(m.refs||[]).map(r=>`<a href="${r.url}" target="_blank" rel="noopener">${r.label}</a>`).join("")||"—"}</div></article>`).join("");
 document.querySelector("#revision").textContent=(lang==="zh"?"方法修订日期：":"Methods revision: ")+db.revision;
}
document.querySelector("#lang").onclick=()=>{lang=lang==="en"?"zh":"en";render();}; render();
</script></body></html>
